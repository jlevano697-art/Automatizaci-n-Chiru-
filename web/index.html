<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel de contenido · Chiru</title>
<link rel="icon" href="/assets/chiru_logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/estilos.css">
</head><body>
<div class="wrap">
  <header><img class="logo" src="/assets/chiru_logo.svg" alt="Chiru"><span class="sp"></span><span class="fecha" id="fecha"></span></header>

  <section id="login" hidden>
    <h1>Panel de contenido</h1>
    <form id="form-login" class="login-box" autocomplete="off">
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required>
      <button class="b1" type="submit">Entrar</button>
      <div class="msg" id="login-msg"></div>
    </form>
  </section>

  <section id="panel" hidden>
    <h1>Qué se va a publicar</h1>
    <div class="aviso">Nada se envía a Buffer hasta que tú pulses <b>Aprobar</b>. Puedes cambiar el texto y la hora antes. Los cambios se guardan directo en el repositorio.</div>
    <div class="aviso" id="estado-envio" hidden></div>
    <div class="barra"><span id="actualizado">Cargando…</span><span class="sp"></span><button class="b2" id="btn-actualizar" type="button">Actualizar ahora</button><button class="b2" id="btn-salir" type="button">Salir</button></div>
    <div id="app"></div>
  </section>
</div>
<script src="/app.js" defer></script>
</body></html>
