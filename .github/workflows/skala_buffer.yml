name: Skala - enviar videos a Buffer

on:
  schedule:
    - cron: "37 * * * *"   # cada hora (minuto 37). Solo envía lo aprobado que se publica en las próximas 72 h
  workflow_dispatch:
    inputs:
      diagnostico:
        description: "Listar organizaciones, canales y tipos de post de la cuenta de Buffer de Skala (no muestra la clave)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: skala-buffer
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diagnóstico
        if: ${{ inputs.diagnostico }}
        env:
          SKALA_BUFFER_API_KEY: ${{ secrets.SKALA_BUFFER_API_KEY }}
        run: node scripts/skala_enviar_a_buffer.mjs --diagnostico
      - name: Enviar a Buffer lo aprobado
        if: ${{ !inputs.diagnostico }}
        env:
          # Seguro por defecto: solo publica si la variable de repositorio SKALA_MODO vale "real".
          SKALA_MODO: ${{ vars.SKALA_MODO }}
          SKALA_CANALES: ${{ vars.SKALA_CANALES }}
          SKALA_BUFFER_API_KEY: ${{ secrets.SKALA_BUFFER_API_KEY }}
        run: node scripts/skala_enviar_a_buffer.mjs
      - name: Guardar estado de la cola de Skala
        if: ${{ always() && !inputs.diagnostico }}
        run: |
          if [ -n "$(git status --porcelain skala/cola.json)" ]; then
            git config user.name "chiru-bot"
            git config user.email "chiru-bot@users.noreply.github.com"
            git add skala/cola.json
            git commit -m "Skala: actualizar estado de la cola"
            git pull --rebase origin main
            git push
          fi
