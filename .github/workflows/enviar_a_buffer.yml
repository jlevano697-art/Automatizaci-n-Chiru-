name: Enviar publicaciones a Buffer

on:
  schedule:
    - cron: "0 13 * * *"   # todos los días a las 13:00 UTC (08:00 en Lima)
  workflow_dispatch:
    inputs:
      diagnostico:
        description: "Listar organizaciones y canales de Buffer (no muestra la clave)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: enviar-a-buffer
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diagnóstico
        if: ${{ inputs.diagnostico }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/enviar_a_buffer.mjs --diagnostico
      - name: Enviar a Buffer lo aprobado
        if: ${{ !inputs.diagnostico }}
        env:
          # MODO=real solo cuando crees la variable de repositorio MODO con valor "real"
          MODO: ${{ vars.MODO }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: node scripts/enviar_a_buffer.mjs
      - name: Guardar estado de la cola
        run: |
          if [ -n "$(git status --porcelain cola.json)" ]; then
            git config user.name "chiru-bot"
            git config user.email "chiru-bot@users.noreply.github.com"
            git add cola.json
            git commit -m "Actualizar estado de la cola"
            git push
          fi
